name: Release

# A tag builds and publishes. A push to master only builds, to keep the Rust
# cache warm: a tag run may restore caches saved on its own tag or on the
# default branch, never on another tag, so without this every release
# compiled every dependency again (~16 min).
on:
  push:
    tags:
      - "v*"
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish the native app
    runs-on: windows-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        if: env.IS_TAG == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/native-shell

      # master: compile the release build and stop; the cache saves after.
      - name: Warm the build cache
        if: env.IS_TAG != 'true'
        shell: pwsh
        working-directory: crates/native-shell
        run: cargo build --release

      - name: NSIS
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      # The tag names the version; the crate must say the same.
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $v = (Select-String -Path crates/native-shell/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but crates/native-shell is $v" }
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the installer
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $setup = powershell -ExecutionPolicy Bypass -File tools/build_installer.ps1 | Select-Object -Last 1
          "SETUP=$setup" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Signed with the updater key both apps trust (minisign, as tauri signs).
      - name: Sign
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx --yes @tauri-apps/cli@2 signer sign "$env:SETUP"
          if (-not (Test-Path "$env:SETUP.sig")) { throw "no signature written" }

      - name: Release notes from CHANGELOG
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "ByteHive $GITHUB_REF_NAME" > notes.md

      # This repository is private, so installers and latest.json go to the
      # public tdat-dev/maestro-releases, which the updaters read.
      - name: Publish
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $name = Split-Path $env:SETUP -Leaf
          $url = "https://github.com/tdat-dev/maestro-releases/releases/download/${{ github.ref_name }}/$name"
          node tools/latest_json.mjs $env:VERSION $url "$env:SETUP.sig" notes.md latest.json
          gh release create "${{ github.ref_name }}" -R tdat-dev/maestro-releases --target main --title "ByteHive ${{ github.ref_name }}" --notes-file notes.md "$env:SETUP" "$env:SETUP.sig" latest.json
