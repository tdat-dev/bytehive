name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    strategy:
      fail-fast: false
      matrix:
        # Windows only. The macOS jobs never shipped: the arm64 build failed
        # every release and the Intel runner (macos-13) is never handed out, so
        # the run hung queued. Add them back (aarch64-apple-darwin on
        # macos-latest) once someone runs ByteHive on a Mac and it builds there.
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: npm ci

      # beforeBuildCommand bundles the MCP server the installer carries.
      - name: Install MCP server dependencies
        run: npm ci --prefix mcp

      # This repository is private, so its releases can't be downloaded by the
      # people who installed ByteHive. Installers and the updater's latest.json
      # go to the public tdat-dev/bytehive-releases instead (releases only, no
      # code), which is what tauri.conf.json's updater endpoint reads.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md)
          {
            echo "body<<BYTEHIVE_NOTES_EOF"
            echo "${notes:-ByteHive $GITHUB_REF_NAME}"
            echo "BYTEHIVE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          # A fine-grained token with Contents: read and write on
          # tdat-dev/bytehive-releases; GITHUB_TOKEN can't write to another repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: tdat-dev
          repo: bytehive-releases
          # the tag is made there, on its own branch: this repo's commits aren't in it
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "ByteHive ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
