name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  length:
    name: File length gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check file lengths
        run: node tools/check_file_length.mjs

  frontend:
    name: Frontend (tsc / vitest / build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  rust:
    name: Rust (cargo check / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/agent-core
            crates/supervise
            crates/native-shell

      # dashboard.rs include_str!s xterm's js/css straight out of node_modules,
      # so the crate does not compile until the npm tree is on disk.
      - name: Install dependencies
        run: npm ci

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

      # crates/* (agent-core, supervise, native-shell) live outside the
      # src-tauri workspace, so each gets its own check + test.
      - name: Cargo check/test crates
        shell: pwsh
        run: |
          foreach ($d in @('crates/agent-core', 'crates/supervise', 'crates/native-shell')) {
            cargo check --manifest-path "$d/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cargo test --manifest-path "$d/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
