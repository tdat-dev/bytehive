name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  length:
    name: File length gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check file lengths
        run: node tools/check_file_length.mjs

  rust:
    name: Rust crates (check / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/agent-core
            crates/supervise
            crates/dashboard
            crates/browser-hub
            crates/native-shell

      # Each crate is its own workspace, so each gets its own check + test.
      - name: Cargo check/test crates
        shell: pwsh
        run: |
          foreach ($d in @('crates/agent-core', 'crates/supervise', 'crates/dashboard', 'crates/browser-hub', 'crates/native-shell')) {
            cargo check --manifest-path "$d/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cargo test --manifest-path "$d/Cargo.toml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  mcp:
    name: MCP server (typecheck / test / build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npm run build
