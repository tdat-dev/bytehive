name: Supervisor Release

on:
  push:
    tags:
      - "supervisor-v*"

permissions:
  contents: write

concurrency:
  group: supervisor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Supervisor release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: "--config src-tauri/tauri.supervisor.resolved.json"
    runs-on: ${{ matrix.platform }}
    env:
      VITE_EDITION: supervisor
      VITE_DASH_PORT: 8577
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: npm ci

      # The Supervisor edition rides a generated full config (base + small
      # overlay), so nested overrides like the updater endpoint don't depend
      # on CLI merge semantics and never drift (version included).
      - name: Resolve Supervisor config
        run: node tools/supervisor-config.mjs --write

      # Installers and the updater's latest.json go to the public
      # tdat-dev/maestro-supervisor-releases (releases only, no code), which
      # is what the Supervisor updater endpoint reads. NOTE: RELEASES_TOKEN
      # must have Contents: read and write on that repo too, not just
      # tdat-dev/maestro-releases, or publishing fails.
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#supervisor-v}"
          notes=$(awk -v v="$v" 'index($0, "## [" v "]") == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md)
          {
            echo "body<<MAESTRO_NOTES_EOF"
            echo "${notes:-Maestro Supervisor $GITHUB_REF_NAME}"
            echo "MAESTRO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: tdat-dev
          repo: maestro-supervisor-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "Maestro Supervisor ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
