[package]
name = "bytehive-native"
version = "0.1.0"
description = "ByteHive drawn by itself: Rust + GPUI, no WebView."
edition = "2024"
publish = false

[[bin]]
name = "bytehive-native"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../crates/agent-core" }
alacritty_terminal = "0.26.0"
anyhow = "1"
async-channel = "2"
# gpui-pre has no semver promise: exact pin, upgrades are deliberate.
gpui-kit = "=0.9.0"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[workspace]

[profile.dev]
# Full debug info for this dependency tree is what filled the disk last time.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
