[package]
name = "bytehive-native"
version = "0.16.8"
description = "ByteHive drawn by itself: Rust + GPUI, no WebView."
edition = "2024"
publish = false

[[bin]]
name = "bytehive-native"
path = "src/main.rs"

[dependencies]
agent-core = { path = "../crates/agent-core" }
alacritty_terminal = "0.26.0"
anyhow = "1"
base64 = "0.22"
browser-hub = { path = "../crates/browser-hub" }
# The live view decodes the browser's JPEG frames (the same image crate GPUI uses).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
minisign-verify = "0.2"
tauri-winrt-notification = "0.7"
async-channel = "2"
chrono = "0.4"
dashboard = { path = "../crates/dashboard" }
# gpui-pre has no semver promise: exact pin, upgrades are deliberate.
gpui-kit = "=0.9.0"
portable-pty = "0.9"
# Remote store (cloud/crypto.rs): sealed with AES-256-GCM, keys from the passphrase.
aes-gcm = "0.10"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
supervise = { path = "../crates/supervise" }
tray-icon = "0.23"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
# The Company's 3D office draws with its own GPU device (office3d/gpu.rs): DX12 only.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[workspace]

[profile.dev]
# Full debug info for this dependency tree is what filled the disk last time.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

# An unoptimised argon2 takes seconds per dashboard sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
tempfile = "3"
