[package]
name = "native-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-core = { version = "0.1.0", path = "../agent-core" }
base64 = "0.22"
browser-hub = { path = "../browser-hub" }
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
chrono = "0.4"
dashboard = { path = "../dashboard" }
eframe = "0.37.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
portable-pty = "0.9"
regex = "1"
rfd = "0.16.0"
serde_json = "1"
ureq = "3"
supervise = { version = "0.1.0", path = "../supervise" }
uuid = { version = "1.29.0", features = ["v4"] }
vte = "0.15"

[profile.dev.package.argon2]
# An unoptimised argon2 takes seconds per dashboard login (and per test).
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
