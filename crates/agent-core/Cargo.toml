[package]
name = "agent-core"
version = "0.1.0"
description = "Headless agent orchestration core: PTY agents, registry, taps, scrollback. No UI, no Tauri."
authors = ["tdat-dev"]
license = "MIT"
repository = "https://github.com/tdat-dev/maestro"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
anyhow = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
portable-pty = "0.9.0"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
