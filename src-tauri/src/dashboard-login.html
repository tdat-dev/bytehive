<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro fleet: sign in</title>
<style>
  :root{--bg:#090a0c;--s0:#0f1115;--s1:#16181d;--s2:#20232a;--line:#20232a;--line2:#323842;
    --text:#f8fafc;--muted:#94a3b8;--muted2:#64748b;--accent:#c6f135;--ink:#1a2e05;--err:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:16px;max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased;min-height:100vh}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  h1{font-size:18px;font-style:italic;font-weight:800;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  form{margin-top:12vh;padding:18px 16px;border:1px solid var(--line);border-radius:11px;background:var(--s1);
    display:flex;flex-direction:column;gap:12px}
  label{font-size:14px;font-weight:650}
  p{font-size:12.5px;color:var(--muted);line-height:1.45}
  input{background:var(--s0);border:1px solid var(--line2);color:var(--text);border-radius:8px;
    padding:11px 12px;font-size:16px;font-family:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  button{background:var(--accent);color:var(--ink);border:none;border-radius:8px;padding:11px;
    font-weight:700;font-size:14px}
  button:disabled{opacity:.6}
  .msg{min-height:1.2em;font-size:12.5px;color:var(--err)}
</style>
</head>
<body>
<header><h1>Maestro <span>fleet</span></h1></header>
<form id="f">
  <label for="pw">Password</label>
  <p>The one you set in Maestro, under Settings, Remote.</p>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <div class="msg" id="msg" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
  const f = document.getElementById("f"), pw = document.getElementById("pw");
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    go.disabled = true; msg.textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Maestro": "1" },
        body: JSON.stringify({ password: pw.value }) });
      if (r.ok) { location.replace("/"); return; }
      const o = await r.json().catch(() => ({}));
      msg.textContent = r.status === 429
        ? "Too many tries. Wait " + (o.seconds || 1) + " s and try again."
        : "That's not the password.";
      pw.select();
    } catch (err) {
      msg.textContent = "Can't reach Maestro. Is it still running?";
    }
    go.disabled = false;
  });
</script>
</body>
</html>
